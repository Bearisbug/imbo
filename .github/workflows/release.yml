name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: sh -n install.sh

  client:
    strategy:
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-darwin, platform: macos-aarch64 }
          - { os: macos-15, target: x86_64-apple-darwin, platform: macos-x86_64 }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, platform: linux-x86_64 }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, platform: linux-aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked -p imbo --target ${{ matrix.target }}
      - name: package
        run: |
          mkdir -p out stage
          cp target/${{ matrix.target }}/release/imbo stage/imbo
          tar -czf out/imbo-${{ matrix.platform }}.tar.gz -C stage imbo
      - uses: actions/upload-artifact@v5
        with:
          name: client-${{ matrix.platform }}
          path: out/*

  server:
    strategy:
      matrix:
        include:
          - { os: ubuntu-22.04, arch: amd64 }
          - { os: ubuntu-22.04-arm, arch: arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked -p imbo-server
      - name: package
        run: |
          mkdir -p out stage
          cp target/release/imbo-server stage/imbo-server
          tar -czf out/imbo-server-linux-${{ matrix.arch }}.tar.gz -C stage imbo-server
      - uses: actions/upload-artifact@v5
        with:
          name: server-${{ matrix.arch }}
          path: out/*

  publish:
    needs: [test, client, server]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: art
          merge-multiple: true
      - name: checksums
        run: |
          cp install.sh art/install.sh
          echo "${GITHUB_REF_NAME#v}" > art/version
          cd art && sha256sum imbo-*.tar.gz > checksums.txt && cat checksums.txt
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" art/* --title "$GITHUB_REF_NAME" --generate-notes $flags
      - name: unpack server binaries for the image
        run: |
          for a in amd64 arm64; do
            mkdir -p dist/server/linux-$a
            tar -xzf art/imbo-server-linux-$a.tar.gz -C dist/server/linux-$a
          done
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/bearisbug/imbo-server:${{ github.ref_name }}
            ${{ !contains(github.ref_name, '-') && 'ghcr.io/bearisbug/imbo-server:latest' || '' }}

  # Installs the release on api.imbo.dev through SSM (deploy/deploy.sh); pre-releases (tags with a "-") stay off it.
  deploy:
    needs: publish
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    concurrency: deploy-server
    permissions:
      contents: read
      deployments: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::867492127909:role/imbo-deploy
          aws-region: ap-east-1
      - id: deployment
        run: |
          id=$(jq -n --arg ref "$GITHUB_REF_NAME" '{ref: $ref, environment: "api.imbo.dev", auto_merge: false, required_contexts: []}' \
            | gh api "repos/$GITHUB_REPOSITORY/deployments" --input - --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"
          gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" -f state=in_progress >/dev/null
      - run: deploy/deploy.sh "$GITHUB_REF_NAME"
      - if: always() && steps.deployment.outputs.id
        run: |
          gh api "repos/$GITHUB_REPOSITORY/deployments/${{ steps.deployment.outputs.id }}/statuses" \
            -f state=${{ job.status == 'success' && 'success' || 'failure' }} -f environment_url=https://api.imbo.dev/v1/health \
            -f log_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
