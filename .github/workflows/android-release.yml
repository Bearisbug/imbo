name: android

# 安卓端发布包：打 android-v* tag 或手动触发。
# 需要的仓库 secrets：
#   IMBO_KEYSTORE_BASE64    release keystore 的 base64（base64 -w0 imbo-release.jks）
#   IMBO_KEYSTORE_PASSWORD  store 口令
#   IMBO_KEY_PASSWORD       key 口令（通常与 store 相同）
# 需要的仓库 variable：
#   IMBO_BASE_URL           发布包内置的服务端地址，例如 https://imbo.example.com
#   IMBO_NTFY_URL           可选，ntfy 实例地址，例如 https://ntfy.example.com（账号页拼订阅链接用）

on:
  workflow_dispatch:
  push:
    tags:
      - 'android-v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.IMBO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "IMBO_KEYSTORE_BASE64 is not set; the release build will be unsigned" >&2
            exit 1
          fi
          mkdir -p android/keys
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/keys/release.jks

      - name: Write keystore.properties
        env:
          STORE_PASSWORD: ${{ secrets.IMBO_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.IMBO_KEY_PASSWORD }}
        run: |
          cat > android/keystore.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/android/keys/release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=imbo
          keyPassword=$KEY_PASSWORD
          EOF


      - name: Build release APK and AAB
        working-directory: android
        run: |
          ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease \
            "-Pimbo.useMock=false" \
            "-Pimbo.baseUrl=${{ vars.IMBO_BASE_URL }}" \
            "-Pimbo.ntfyUrl=${{ vars.IMBO_NTFY_URL }}"

      - name: Checksums
        working-directory: android
        run: |
          cd app/build/outputs
          sha256sum apk/release/*.apk bundle/release/*.aab > checksums.txt || true
          cat checksums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: imbo-android-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/checksums.txt
