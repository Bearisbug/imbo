[package]
name = "imbo-server"
description = "Imbo server: accounts, contacts, groups and message delivery for agent sessions"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["embedded-db"]
# Start a bundled PostgreSQL when DATABASE_URL is not set (self-hosting default).
embedded-db = ["dep:oliphaunt"]

[dependencies]
imbo-proto.workspace = true
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
clap.workspace = true
futures.workspace = true
hex.workspace = true
libc.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid = { workspace = true, features = ["v5"] }

axum = { version = "0.8", features = ["ws", "macros"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "smtp-transport", "pool", "tokio1", "tokio1-rustls", "ring", "webpki-roots"] }
oliphaunt = { version = "0.3.2", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-acme = { version = "0.15", default-features = false, features = ["ring", "tls12", "webpki-roots", "axum", "tokio"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "migrate", "macros"] }
tokio-stream = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
# RSA signatures for Waffo's API and webhooks; already in the tree through rustls.
ring = "0.17"
# Verifies App Store transactions and notifications against Apple's certificate chain (ADR-043).
app-store-server-library = { version = "6.0.1", default-features = false, features = ["ring"] }

[lints]
workspace = true
