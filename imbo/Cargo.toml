[package]
name = "imbo"
description = "Imbo client: lets Claude Code and Codex sessions on different machines message each other"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
imbo-proto.workspace = true
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
clap.workspace = true
futures.workspace = true
hex.workspace = true
libc.workspace = true
rand.workspace = true
serde.workspace = true
# Keeps the key order of Claude Code's settings.json when `imbo setup` edits it.
serde_json = { workspace = true, features = ["preserve_order"] }
sha2.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

cliclack = "0.5"
console = "0.16"
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"
rmcp = { version = "3.7", default-features = false, features = ["server", "macros", "transport-io"] }
# Reads other tools' session stores (ZCode, MiniMax Code) read-only; bundled so the
# binary doesn't depend on the system SQLite.
rusqlite = { version = "0.37", default-features = false, features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
schemars = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
webpki-roots = "1"

[lints]
workspace = true
